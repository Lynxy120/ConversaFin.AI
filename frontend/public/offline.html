<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Offline · KasirChat.AI</title>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            color: #0F172A;
            background: radial-gradient(60rem 40rem at 0 0, #E0F2FE, transparent 60%), radial-gradient(60rem 40rem at 100% 100%, #F3E8FF, transparent 60%), #fff
        }

        .c {
            max-width: 22rem;
            margin: 1rem;
            padding: 2rem;
            text-align: center;
            border-radius: 1rem;
            background: rgba(255, 255, 255, .7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, .05)
        }

        p {
            color: #64748B
        }

        button {
            min-height: 44px;
            padding: 0 1.25rem;
            border: 0;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(135deg, #0EA5E9, #3B82F6)
        }
    </style>
</head>

<body>
    <div class="c">
        <h1>Anda sedang offline</h1>
        <p>Periksa koneksi internet, lalu coba lagi.</p><button onclick="location.reload()">Coba lagi</button>
    </div>
</body>

</html>
